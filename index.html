<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Protein Family Meal Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0078D4 0%, #0084CB 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #0078D4;
            font-size: 28px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #0078D4;
            color: white;
        }

        .btn-primary:hover {
            background: #0064B0;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #d68910;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .admin-badge {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .admin-badge.view-only {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .day-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .day-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .day-header {
            background: linear-gradient(135deg, #0078D4 0%, #0084CB 100%);
            color: white;
            padding: 15px;
            font-size: 18px;
            font-weight: 700;
        }

        .day-content {
            padding: 20px;
        }

        .meal-section {
            margin-bottom: 18px;
        }

        .meal-label {
            font-size: 12px;
            font-weight: 700;
            color: #0078D4;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .meal-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .meal-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-protein {
            background: #fff3cd;
            color: #856404;
        }

        .badge-cal {
            background: #d1ecf1;
            color: #0c5460;
        }

        .badge-cuisine {
            color: white;
            font-size: 9px;
        }

        .badge-prep {
            background: #f0f0f0;
            color: #333;
        }

        .cuisine-indian {
            background: #ff9800;
        }

        .cuisine-mediterranean {
            background: #1976d2;
        }

        .cuisine-asian {
            background: #c2185b;
        }

        .cuisine-italian {
            background: #d32f2f;
        }

        .cuisine-western {
            background: #388e3c;
        }

        .meal-meta {
            font-size: 11px;
            color: #666;
            margin-bottom: 10px;
        }

        .meal-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            flex: 1;
        }

        .btn-video {
            background: #e74c3c;
            color: white;
        }

        .btn-video:hover {
            background: #c0392b;
        }

        .btn-swap {
            background: #3498db;
            color: white;
        }

        .btn-swap:hover {
            background: #2980b9;
        }

        .nutrition-box {
            background: #f8f9fa;
            border-left: 4px solid #0078D4;
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 12px;
        }

        .nutrition-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .protein-status {
            font-size: 14px;
            font-weight: 700;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #ddd;
        }

        .status-good {
            color: #28a745;
        }

        .status-bad {
            color: #dc3545;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            color: #0078D4;
            margin-bottom: 20px;
        }

        .modal-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
            background: none;
            border: none;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
        }

        .form-group input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .meal-selection {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .meal-option {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .meal-option:hover {
            border-color: #0078D4;
            background: #f0f7ff;
        }

        .meal-option.selected {
            border-color: #0078D4;
            background: #e3f2fd;
        }

        .shopping-list {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        .shopping-list.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shopping-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .shopping-header {
            font-size: 22px;
            font-weight: 700;
            color: #0078D4;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shopping-header-note {
            font-size: 13px;
            font-weight: normal;
            color: #666;
            display: block;
            margin-top: 5px;
        }

        .shopping-categories {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .shopping-category {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }

        .category-title {
            font-weight: 700;
            color: #0078D4;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .category-items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item {
            padding: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .item-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .item-name {
            flex: 1;
        }

        .item-qty {
            font-weight: 600;
            color: #0078D4;
            min-width: 80px;
            text-align: right;
        }

        .item-checked {
            text-decoration: line-through;
            color: #999;
        }

        @media (max-width: 768px) {
            .week-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            .header h1 {
                font-size: 22px;
            }
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }

            .header, .week-grid, .header-buttons, .btn, .login-modal, .modal, .meal-modal {
                display: none !important;
            }

            .shopping-list {
                position: static !important;
                background: white !important;
                display: block !important;
            }

            .shopping-list.active {
                display: block !important;
            }

            .shopping-content {
                width: 100% !important;
                padding: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
            }

            .shopping-header {
                border-bottom: 2px solid #0078D4;
                padding-bottom: 15px;
                margin-bottom: 20px;
            }

            .modal-close {
                display: none !important;
            }

            .shopping-categories {
                color: #000;
            }

            .category-title {
                color: #0078D4;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🍛 High-Protein Family Meal Planner 💪</h1>
            </div>
            <div class="header-buttons">
                <button class="btn btn-warning" onclick="goToShoppingList()">🛒 Go to Shopping List</button>
                <span class="admin-badge" id="adminBadge">👁️ VIEW ONLY</span>
                <button class="btn btn-primary" onclick="openLoginModal()">Login</button>
                <button class="btn btn-danger" id="logoutBtn" style="display:none;" onclick="logout()">Logout</button>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <button class="btn btn-success" id="generateBtn" onclick="generateNewPlan()" style="display:none;">📋 Generate New Meal Plan</button>
        </div>

        <div class="week-grid" id="mealGrid"></div>
    </div>

    <!-- Login Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeLoginModal()">×</button>
            <div class="modal-header">🔑 Admin Login</div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="passwordInput" placeholder="Enter admin password" onkeypress="if(event.key==='Enter') verifyPassword()">
            </div>
            <button class="btn btn-primary" onclick="verifyPassword()" style="width: 100%;">Login</button>
        </div>
    </div>

    <!-- Meal Selection Modal -->
    <div class="modal" id="mealModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeMealModal()">×</button>
            <div class="modal-header">Replace Meal</div>
            <div id="mealOptions" class="meal-selection"></div>
            <button class="btn btn-primary" onclick="replaceMeal()" style="width: 100%; margin-top: 15px;">Confirm Replacement</button>
        </div>
    </div>

    <!-- Shopping List Modal -->
    <div class="shopping-list" id="shoppingModal">
        <div class="shopping-content">
            <div class="shopping-header">
                <div>
                    <span>🛒 Weekly Shopping List (2 Adults)</span>
                    <span class="shopping-header-note">Quantities calculated for the week</span>
                </div>
                <button class="modal-close" onclick="closeShoppingList()">×</button>
            </div>
            <div id="shoppingList" class="shopping-categories"></div>
            <button class="btn btn-primary" onclick="printShoppingList()" style="width: 100%; margin-top: 15px;">🖨️ Print List</button>
        </div>
    </div>

        const ADMIN_PASSWORD = 'harish123';
        let mealPlan = {};
        let isAdmin = false;
        let selectedMeal = null;

        function init() {
            const saved = localStorage.getItem('mealPlan');
            if (saved) {
                mealPlan = JSON.parse(saved);
            } else {
                generateNewPlan();
            }
            isAdmin = localStorage.getItem('mealPlanAdmin') === 'true';
            updateAdminUI();
            renderMeals();
        }

        function generateNewPlan() {
            mealPlan = {};
            const days = ['day0', 'day1', 'day2', 'day3', 'day4', 'day5', 'day6'];
            
            days.forEach(day => {
                mealPlan[day] = {
                    breakfast: recipes.breakfast[Math.floor(Math.random() * recipes.breakfast.length)],
                    lunch: recipes.lunch[Math.floor(Math.random() * recipes.lunch.length)],
                    dinner: recipes.dinner[Math.floor(Math.random() * recipes.dinner.length)]
                };
            });

            localStorage.setItem('mealPlan', JSON.stringify(mealPlan));
        }

        function updateAdminUI() {
            const badge = document.getElementById('adminBadge');
            const logoutBtn = document.getElementById('logoutBtn');
            const generateBtn = document.getElementById('generateBtn');

            badge.textContent = isAdmin ? '🔓 ADMIN' : '👁️ VIEW';
            logoutBtn.style.display = isAdmin ? 'inline-block' : 'none';
            generateBtn.style.display = isAdmin ? 'inline-block' : 'none';
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('passwordInput').focus();
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
            document.getElementById('passwordInput').value = '';
        }

        function verifyPassword() {
            if (document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
                isAdmin = true;
                localStorage.setItem('mealPlanAdmin', 'true');
                updateAdminUI();
                closeLoginModal();
            } else {
                alert('❌ Wrong password!');
            }
        }

        function logout() {
            isAdmin = false;
            localStorage.removeItem('mealPlanAdmin');
            updateAdminUI();
        }

        function renderMeals() {
            const grid = document.getElementById('mealGrid');
            grid.innerHTML = '';
            const dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

            dayNames.forEach((day, i) => {
                const dayKey = `day${i}`;
                const meals = mealPlan[dayKey];

                if (!meals) return;

                const card = document.createElement('div');
                card.className = 'day-card';

                const protein = meals.breakfast.p + meals.lunch.p + meals.dinner.p;
                const calories = meals.breakfast.cal + meals.lunch.cal + meals.dinner.cal;

                card.innerHTML = `
                    <div class="day-header">${day}</div>
                    <div class="day-content">
                        ${renderMealItem(i, 'breakfast', meals.breakfast)}
                        ${renderMealItem(i, 'lunch', meals.lunch)}
                        ${renderMealItem(i, 'dinner', meals.dinner)}
                        <div class="nutrition-box">
                            <div class="nutrition-row"><span>Protein:</span> <strong>${protein}g</strong></div>
                            <div class="nutrition-row"><span>Calories:</span> <strong>${calories}</strong></div>
                            <div class="protein-status ${protein >= 80 ? 'status-good' : 'status-bad'}">
                                ${protein >= 80 ? '✅ 80g+ Goal Met!' : '❌ Below 80g'}
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderMealItem(day, type, meal) {
            const cuisine = meal.c === 'Indian' ? 'cuisine-indian' : meal.c === 'Mediterranean' ? 'cuisine-mediterranean' : meal.c === 'Asian' ? 'cuisine-asian' : meal.c === 'Italian' ? 'cuisine-italian' : 'cuisine-western';

            return `<div class="meal-section">
                <div class="meal-label">${type}</div>
                <div class="meal-name">${meal.n}</div>
                <div class="meal-badges">
                    <span class="badge badge-cuisine ${cuisine}">${meal.c}</span>
                    <span class="badge badge-protein">💪 ${meal.p}g</span>
                    <span class="badge badge-cal">🔥 ${meal.cal}</span>
                    <span class="badge badge-prep">⏰ ${meal.t}m</span>
                </div>
                <div class="meal-meta">📍 ${meal.r}</div>
                <div class="meal-actions">
                    <button class="btn btn-small btn-video" onclick="window.open('${meal.v}')">📹 Video Recipe</button>
                    ${isAdmin ? `<button class="btn btn-small btn-swap" onclick="openSwap(${day}, '${type}')">🔄 Swap</button>` : ''}
                </div>
            </div>`;
        }

        function openSwap(day, type) {
            selectedMeal = { day, type };
            const options = document.getElementById('mealOptions');
            options.innerHTML = '';

            recipes[type].forEach((meal, i) => {
                const div = document.createElement('div');
                div.className = 'meal-option';
                div.innerHTML = `<strong>${meal.n}</strong><br><small>${meal.p}g protein | ${meal.cal} cal | ${meal.r}</small>`;
                div.onclick = () => {
                    document.querySelectorAll('.meal-option').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedMeal.index = i;
                };
                options.appendChild(div);
            });

            document.getElementById('mealModal').classList.add('active');
        }

        function replaceMeal() {
            if (selectedMeal.index === undefined) return alert('Select a meal!');
            const key = `day${selectedMeal.day}`;
            mealPlan[key][selectedMeal.type] = recipes[selectedMeal.type][selectedMeal.index];
            localStorage.setItem('mealPlan', JSON.stringify(mealPlan));
            renderMeals();
            closeMealModal();
        }

        function closeMealModal() {
            document.getElementById('mealModal').classList.remove('active');
        }

        function goToShoppingList() {
            generateShoppingList();
            document.getElementById('shoppingModal').classList.add('active');
        }

        function generateShoppingList() {
            const aggregated = {};

            // Collect all ingredients from week's meals
            for (let i = 0; i < 7; i++) {
                const dayKey = `day${i}`;
                const meals = mealPlan[dayKey];
                if (!meals) continue;

                [meals.breakfast, meals.lunch, meals.dinner].forEach(meal => {
                    if (meal.i) {
                        for (const [item, qty] of Object.entries(meal.i)) {
                            aggregated[item] = (aggregated[item] || 0) + qty;
                        }
                    }
                });
            }

            // Organize by category
            const categories = {
                'Dairy & Protein': ['paneer', 'tofu', 'milk', 'yogurt', 'egg', 'cheese', 'creamcheese', 'mozzarella', 'feta'],
                'Grains & Flours': ['wheat', 'rice', 'flour', 'semolina', 'oats', 'quinoa', 'noodles', 'pasta', 'bread', 'focaccia', 'wrap', 'uradidl', 'poha', 'millet', 'bulgur'],
                'Vegetables & Produce': ['onion', 'tomato', 'cucumber', 'carrot', 'bell pepper', 'spinach', 'eggplant', 'mushroom', 'potatoes', 'peas', 'beans', 'radish', 'vegetables', 'pepper', 'bhindi', 'methi', 'basil', 'parsley', 'cilantro', 'avocado', 'garlic', 'ginger', 'banana', 'berries', 'lemon', 'lime'],
                'Legumes & Pulses': ['chanadal', 'moongdal', 'uradidal', 'lentils', 'chickpeas', 'kidneybeans', 'blackbeans', 'kidney', 'moongsprouts'],
                'Condiments & Spices': ['cumin', 'turmeric', 'chili powder', 'garam masala', 'salt', 'cardamom', 'cinnamon', 'fish', 'greenCurry', 'terriyaki', 'soydrink', 'tahini', 'peanutbutter', 'honey', 'jaggery', 'asafetida'],
                'Oils & Fats': ['oil', 'butter', 'olive', 'coconutoil'],
                'Condiments & Sauces': ['soy sauce', 'coconutmilk', 'cream', 'broth'],
                'Other': ['proteinjal', 'chiaseeds', 'almonds', 'peanuts', 'nuts', 'granola']
            };

            const shoppingList = document.getElementById('shoppingList');
            shoppingList.innerHTML = '';

            for (const [category, items] of Object.entries(categories)) {
                const div = document.createElement('div');
                div.className = 'shopping-category';

                let html = `<div class="category-title">${category}</div><div class="category-items">`;

                items.forEach(item => {
                    if (aggregated[item]) {
                        const qty = aggregated[item];
                        let displayQty = '';

                        if (item.includes('oil') || item.includes('olive') || item.includes('butter')) {
                            displayQty = qty > 1000 ? `${(qty/1000).toFixed(1)}L` : `${qty}ml`;
                        } else if (item.includes('milk') || item.includes('yogurt') || item.includes('cream') || item.includes('broth') || item.includes('coconutmilk')) {
                            displayQty = qty > 1000 ? `${(qty/1000).toFixed(1)}L` : `${qty}ml`;
                        } else if (item.includes('egg') || item === 'pepper' || item === 'bread') {
                            displayQty = `${Math.ceil(qty/100)} units`;
                        } else {
                            displayQty = qty >= 1000 ? `${(qty/1000).toFixed(1)}kg` : `${qty}g`;
                        }

                        html += `<div class="item"><input class="item-checkbox" type="checkbox" onchange="this.parentElement.classList.toggle('item-checked')"><span class="item-name">${item.charAt(0).toUpperCase() + item.slice(1)}</span><span class="item-qty">${displayQty}</span></div>`;
                    }
                });

                html += '</div>';
                div.innerHTML = html;
                shoppingList.appendChild(div);
            }
        }

        function closeShoppingList() {
            document.getElementById('shoppingModal').classList.remove('active');
        }

        function printShoppingList() {
            window.print();
        }

        init();
    </script>
</body>
</html>
